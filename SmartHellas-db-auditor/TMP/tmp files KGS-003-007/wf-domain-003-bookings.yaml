definition_registry:

  # ==========================================================
  # WF-020 Guest Access Management
  # ==========================================================


  - id: WF-020

    name: guest_access_management

    title: Guest Access Management


    version: 1.0

    status: active


    identity:

      domain:

        - booking_access


      owner:

        module: 004_booking_lock_engine



    purpose:

      description:

        Manages the complete guest access lifecycle
        from reservation until access removal.



    scope:

      includes:

        - guest_access_creation

        - access_activation

        - access_revocation



      excludes:

        - booking_payment



    trigger:


      event:


        - EVT-020 booking_created



    preconditions:


      - booking_valid

      - property_has_lock



    actors:


      - guest

      - system

      - property_owner



    inputs:


      - booking_information

      - guest_information

      - property_information



    workflow_steps:


      - step: 1

        action:

          validate_booking



      - step: 2

        action:

          determine_access_window



      - step: 3

        action:

          request_door_code



      - step: 4

        action:

          activate_guest_access



      - step: 5

        action:

          monitor_access_period



      - step: 6

        action:

          revoke_access_after_checkout



    outputs:


      - guest_access_profile



    state_machine:


      - SM-023 Guest Access Lifecycle



    events:


      consumes:


        - EVT-020 booking_created



      produces:


        - EVT-023 access_created



    orchestration:


      - ORCH-001 Guest Access Automation



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 005_integration_engine

        - 010_service_portal_engine



    integrations:


      - Airbnb Integration

      - TTLock Integration



    security:


      requirements:


        - guest_identity_validation

        - temporary_access_control



    error_handling:


      strategy:


        fallback_to_manual_access



    compensation:


      actions:


        - revoke_created_access



    observability:


      metrics:


        - guest_access_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001




  # ==========================================================
  # WF-021 Booking Synchronization
  # ==========================================================


  - id: WF-021

    name: booking_synchronization

    title: Booking Synchronization


    version: 1.0

    status: active


    identity:


      domain:

        - booking_management


      owner:

        module: 004_booking_lock_engine



    purpose:


      description:

        Synchronizes Airbnb reservations with SmartHellas.



    scope:


      includes:


        - booking_import

        - booking_update

        - booking_cancellation



    trigger:


      integration_event:


        - INT-003 Airbnb Booking Event



    preconditions:


      - integration_authenticated



    actors:


      - system



    inputs:


      - external_booking_data



    workflow_steps:


      - step: 1

        action:

          receive_booking_event



      - step: 2

        action:

          validate_booking_payload



      - step: 3

        action:

          create_or_update_booking



      - step: 4

        action:

          trigger_access_workflow



    outputs:


      - synchronized_booking



    state_machine:


      - SM-020 Booking Lifecycle



    events:


      produces:


        - EVT-020 booking_created

        - EVT-021 booking_updated



    orchestration:


      - ORCH-021 Booking Synchronization



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 005_integration_engine



    integrations:


      - Airbnb Integration



    security:


      requirements:


        - api_authentication_required

        - payload_validation



    error_handling:


      strategy:


        retry_external_sync



    compensation:


      actions:


        - rollback_booking_update



    observability:


      metrics:


        - booking_sync_latency



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001

definition_registry:


  # ==========================================================
  # WF-022 Booking Confirmation Handling
  # ==========================================================


  - id: WF-022

    name: booking_confirmation_handling

    title: Booking Confirmation Handling


    version: 1.0

    status: active


    identity:

      domain:

        - booking_management


      owner:

        module: 004_booking_lock_engine



    purpose:

      description:

        Processes confirmed reservations and prepares
        access automation.



    scope:

      includes:

        - booking_validation

        - reservation_status_update

        - access_preparation



    trigger:


      event:


        - EVT-022 booking_confirmed



    preconditions:


      - booking_exists

      - guest_information_available



    actors:


      - system



    inputs:


      - booking_record



    workflow_steps:


      - step: 1

        action:

          validate_booking_status



      - step: 2

        action:

          calculate_access_window



      - step: 3

        action:

          create_access_task



      - step: 4

        action:

          notify_access_engine



    outputs:


      - confirmed_booking



    state_machine:


      - SM-020 Booking Lifecycle



    events:


      produces:


        - EVT-020 access_preparation_started



    orchestration:


      - ORCH-021 Booking Processing



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 006_operations_engine



    integrations:


      - Airbnb Integration



    security:


      requirements:


        - booking_authorization_check



    error_handling:


      strategy:


        mark_booking_for_review



    compensation:


      actions:


        - cancel_access_task



    observability:


      metrics:


        - confirmation_processing_time



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001




  # ==========================================================
  # WF-023 Door Code Generation
  # ==========================================================


  - id: WF-023

    name: door_code_generation

    title: Door Code Generation


    version: 1.0

    status: active


    identity:


      domain:

        - access_control


      owner:

        module: 004_booking_lock_engine



    purpose:


      description:

        Automatically generates temporary guest
        access codes.



    scope:


      includes:


        - code_creation

        - validity_period_assignment

        - lock_mapping



      excludes:


        - physical_lock_configuration



    trigger:


      event:


        - EVT-023 access_preparation_started



    preconditions:


      - booking_valid

      - lock_connected



    actors:


      - system



    inputs:


      - booking_period

      - lock_identifier



    workflow_steps:


      - step: 1

        action:

          generate_unique_access_code



      - step: 2

        action:

          assign_validity_window



      - step: 3

        action:

          encrypt_access_data



      - step: 4

        action:

          send_to_ttlock_gateway



    outputs:


      - temporary_access_code



    state_machine:


      - SM-023 Guest Access Lifecycle



    events:


      produces:


        - EVT-024 door_code_created



    orchestration:


      - ORCH-023 Access Code Generation



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 005_integration_engine



    integrations:


      - TTLock Integration

      - G2 Gateway



    security:


      requirements:


        - encrypted_code_storage

        - temporary_permission_scope



    error_handling:


      strategy:


        regenerate_code



    compensation:


      actions:


        - invalidate_code



    observability:


      metrics:


        - code_generation_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001

definition_registry:


  # ==========================================================
