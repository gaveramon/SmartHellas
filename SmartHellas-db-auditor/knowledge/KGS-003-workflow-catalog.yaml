        - event



      lifecycle_states:

        - proposed

        - registered

        - active

        - versioned

        - deprecated

        - retired



      transitions:


        - from: proposed

          to: registered


        - from: registered

          to: active


        - from: active

          to: versioned


        - from: versioned

          to: deprecated


        - from: deprecated

          to: retired



      migration:

        required_for:

          - payload_change

          - contract_change



        strategy:

          event_versioning



      compatibility:

        consumer_compatibility_required: true



      deprecation:

        notice_period_days: 180

        replacement_event_required: true



      retention:

        event_history_required: true



      rules:

        breaking_event_changes_require_new_version: true



      audit:

        canonical: true

        reusable: true

        last_reviewed: null




    # ========================================================
