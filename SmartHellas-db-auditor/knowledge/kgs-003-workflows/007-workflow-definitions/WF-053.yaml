definition_registry:

  # ==========================================================
  # WF-053 Provider Command Execution
  # ==========================================================


  - id: WF-053

    name: provider_command_execution

    title: Provider Command Execution


    version: 1.0

    status: active


    identity:


      domain:


        - device_control



      owner:


        module: 005_integration_engine



      classification:


        business_process: device_control

        criticality: business_critical

        ssot: true



    purpose:


      description: >
        Executes validated commands from SmartHellas
        automations and portal actions towards external
        device providers.



    scope:


      includes:


        - command_validation

        - provider_translation

        - command_execution

        - result_tracking



      excludes:


        - automation_rule_creation



    trigger:


      event:


        - EVT-060 device_command_requested



    preconditions:


      - device_online

      - permission_validated



    actors:


      - system

      - customer



    inputs:


      - device_command

      - target_device



    workflow_steps:


      - step: 1

        action:

          validate_command



      - step: 2

        action:

          translate_provider_command



      - step: 3

        action:

          execute_provider_api_call



      - step: 4

        action:

          validate_response



      - step: 5

        action:

          update_device_state



    outputs:


      - command_result



    state_machine:


      - SM-053 Command Lifecycle



    events:


      produces:


        - EVT-053 command_completed



    orchestration:


      - ORCH-053 Device Command Execution



    dependencies:


      modules:


        - 005_integration_engine

        - 016_automation_engine

        - 003_property_device_engine



    integrations:


      providers:


        - Aqara

        - TTLock

        - Shelly



    security:


      requirements:


        - command_authorization

        - device_permission_check



    error_handling:


      strategy:


        retry_failed_command



    compensation:


      actions:


        - revert_device_state



    observability:


      metrics:


        - command_success_rate

        - execution_latency



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001