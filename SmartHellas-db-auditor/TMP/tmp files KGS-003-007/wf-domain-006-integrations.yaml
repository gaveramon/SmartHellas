    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001

definition_registry:


  # ==========================================================
  # WF-056 Guest Access Automation
  # ==========================================================


  - id: WF-056

    name: guest_access_automation

    title: Guest Access Automation


    version: 1.0

    status: active


    identity:

      domain:

        - guest_access


      owner:

        module: 004_booking_lock_engine


      classification:

        business_process: guest_access

        criticality: business_critical

        ssot: true



    purpose:

      description: >
        Automatically manages guest access lifecycle
        from booking confirmation until checkout.



    scope:

      includes:

        - booking_validation

        - access_permission_creation

        - lock_assignment

        - access_expiration


      excludes:

        - physical_lock_installation



    trigger:


      events:


        - booking_confirmed



    preconditions:


      - property_active

      - smart_lock_available

      - guest_information_available



    actors:


      - guest

      - property_owner

      - system



    inputs:


      - booking_information

      - guest_information

      - property_lock_configuration



    workflow_steps:


      - step: 1

        action:

          validate_booking



      - step: 2

        action:

          identify_property_lock



      - step: 3

        action:

          request_access_creation



      - step: 4

        action:

          schedule_access_period



      - step: 5

        action:

          monitor_access_status



    outputs:


      - guest_access_permission



    state_machine:


      - SM-056 Guest Access Lifecycle



    events:


      produces:


        - EVT-056 guest_access_requested



    orchestration:


      - ORCH-056 Guest Access Management



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 005_integration_engine

        - 015_crm_engine



    integrations:


      providers:


        - TTLock



    security:


      requirements:


        - access_permission_validation

        - guest_identity_protection



    error_handling:


      strategy:


        manual_access_review



    compensation:


      actions:


        - revoke_pending_access



    observability:


      metrics:


        - access_creation_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001





  # ==========================================================
  # WF-057 Automatic Door Code Generation
  # ==========================================================


  - id: WF-057

    name: automatic_door_code_generation

    title: Automatic Door Code Generation


    version: 1.0

    status: active


    identity:


      domain:


        - smart_lock



      owner:


        module: 004_booking_lock_engine



      classification:


        business_process: access_security

        criticality: business_critical

        ssot: true



    purpose:


      description: >
        Generates secure temporary guest door codes
        based on booking dates and property rules.



    scope:


      includes:


        - code_generation

        - expiration_rules

        - lock_assignment

        - security_validation



      excludes:


        - guest_notification



    trigger:


      event:


        - EVT-056 guest_access_requested



    preconditions:


      - valid_booking

      - ttlock_connected



    actors:


      - system



    inputs:


      - booking_period

      - guest_identifier

      - lock_identifier



    workflow_steps:


      - step: 1

        action:

          generate_secure_code



      - step: 2

        action:

          validate_code_rules



      - step: 3

        action:

          send_code_to_ttlock



      - step: 4

        action:

          confirm_lock_activation



    outputs:


      - guest_access_code



    state_machine:


      - SM-057 Access Code Lifecycle



    events:


      produces:


        - EVT-057 access_code_created



    orchestration:


      - ORCH-057 Door Code Management



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 005_integration_engine



    integrations:


      providers:


        - TTLock



    security:


      requirements:


        - encrypted_access_codes

        - audit_access_changes



    error_handling:


      strategy:


        regenerate_code



    compensation:


      actions:


        - revoke_generated_code



    observability:


      metrics:


        - code_generation_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001





  # ==========================================================
  # WF-058 Guest Notification
  # ==========================================================


  - id: WF-058

    name: guest_notification

    title: Guest Notification


    version: 1.0

    status: active


    identity:


      domain:


        - communication



      owner:


        module: 015_crm_engine



      classification:


        business_process: guest_communication

        criticality: operational_critical

        ssot: false



    purpose:


      description: >
        Sends automated guest communication including
        access instructions and door codes.



    scope:


      includes:


        - message_generation

        - delivery

        - reminder_notifications



    trigger:


      event:


        - EVT-057 access_code_created



    workflow_steps:


      - step: 1

        action:

          generate_guest_message



      - step: 2

        action:

          insert_access_information



      - step: 3

        action:

          send_notification



      - step: 4

        action:

          track_delivery



    outputs:


      - notification_status



    dependencies:


      modules:


        - 015_crm_engine

        - 004_booking_lock_engine



    integrations:


      providers:


        - Email Provider

        - Messaging Provider



    security:


      requirements:


        - prevent_code_exposure



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001





