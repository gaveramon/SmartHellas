identity:

  id: KGS-003

  name: Workflow Catalog

  title: Enterprise Workflow Catalog

  version: 2.0.0

  status: active

  maturity: production

  type: knowledge_catalog

  canonical: true

  ssot: true

  namespace: enterprise_auditor

  domain: workflow_management

  description: >
    Canonical workflow catalog defining all enterprise workflows,
    workflow metadata, state machines, events, orchestration,
    integrations and workflow dependencies for the SmartHellas platform.

  parent: knowledge

  children:

    - workflow_registry
    - workflow_definitions
    - state_machines
    - events
    - orchestration
    - integrations
    - dependencies

  related:

    principles: KGS-001

    objects: KGS-002

    ownership: KGS-004

    business_rules: KGS-005

metadata:

  title: Enterprise Workflow Catalog

  short_name: KGS-003

  version: 2.0.0

  schema_version: 2.0.0

  status: active

  maturity: production

  owner: Enterprise Architecture

  steward: Enterprise Auditor

  authors:

    - SmartHellas

  language: en

  format: yaml

  encoding: UTF-8

  source_of_truth: true

  canonical: true

  visibility: internal

  confidentiality: internal

  lifecycle: managed

  created: null

  last_updated: null

  last_reviewed: null

  next_review: null

  review_frequency: quarterly

  change_control: architecture_review

  approval_required: true

  approved_by: null

  tags:

    - workflows
    - orchestration
    - events
    - state-machines
    - enterprise
    - knowledge-graph

  description: >
    Enterprise-wide catalog containing the canonical definition
    of all workflows, workflow metadata, orchestration,
    events, state machines and workflow dependencies.

  purpose: >
    Acts as the Single Source of Truth for workflow definitions
    used by the Enterprise Auditor and SmartHellas platform.

  audience:

    - architects
    - developers
    - enterprise-auditor
    - automation-engine

scope:

  purpose: >
    Defines the functional boundary of the Enterprise Workflow Catalog.
    Specifies which workflow-related knowledge is maintained within
    this catalog and which knowledge is explicitly delegated to
    other KGS catalogs.

  authoritative_for:

    - workflow_categories
    - workflow_registry
    - workflow_definitions
    - workflow_state_machines
    - workflow_events
    - workflow_orchestration
    - workflow_integrations
    - workflow_dependencies
    - workflow_lifecycle

  explicitly_excludes:

    - enterprise_principles
    - sql_objects
    - database_schema
    - modules
    - ownership
    - business_rules
    - security_policies
    - permissions
    - implementation_code
    - api_specifications

  references:

    principles: KGS-001
    objects: KGS-002
    ownership: KGS-004
    business_rules: KGS-005

  assumptions:

    - All referenced modules exist in KGS-002.
    - All referenced objects exist in KGS-002.
    - Business constraints are defined in KGS-005.
    - Ownership is defined in KGS-004.

  guarantees:

    - Every enterprise workflow is registered exactly once.
    - Every workflow has a unique identifier.
    - Every workflow belongs to one canonical category.
    - Every workflow can be validated by the Enterprise Auditor.
    - Every workflow can be traced to related modules and objects.

  out_of_scope:

    - SQL implementation
    - Supabase configuration
    - Edge Functions
    - Trigger implementation
    - RLS policies
    - Physical infrastructure

principles:

  workflow_design:

    canonical_workflow: true

    single_responsibility: true

    deterministic_execution: true

    idempotent_execution: true

    reusable: true

    composable: true

    versioned: true

    auditable: true

    observable: true

    traceable: true

  orchestration:

    event_driven: true

    orchestration_over_choreography: true

    explicit_dependencies: true

    no_hidden_dependencies: true

    no_circular_workflows: true

    retry_safe: true

    compensating_actions_supported: true

  state_management:

    explicit_state_machine: true

    immutable_state_history: true

    valid_state_transitions_only: true

    terminal_states_required: true

  events:

    explicit_event_contracts: true

    unique_event_names: true

    events_are_immutable: true

    events_are_versioned: true

    event_ordering_defined: true

  governance:

    unique_workflow_ids: true

    workflow_registry_required: true

    workflow_definition_required: true

    dependencies_documented: true

    integrations_documented: true

    lifecycle_defined: true

    enterprise_auditable: true

