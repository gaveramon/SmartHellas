definition_registry:

  # ==========================================================
  # WF-057 Automatic Door Code Generation
  # ==========================================================


  - id: WF-057

    name: automatic_door_code_generation

    title: Automatic Door Code Generation


    version: 1.0

    status: active


    identity:


      domain:


        - smart_lock



      owner:


        module: 004_booking_lock_engine



      classification:


        business_process: access_security

        criticality: business_critical

        ssot: true



    purpose:


      description: >
        Generates secure temporary guest door codes
        based on booking dates and property rules.



    scope:


      includes:


        - code_generation

        - expiration_rules

        - lock_assignment

        - security_validation



      excludes:


        - guest_notification



    trigger:


      event:


        - EVT-056 guest_access_requested



    preconditions:


      - valid_booking

      - ttlock_connected



    actors:


      - system



    inputs:


      - booking_period

      - guest_identifier

      - lock_identifier



    workflow_steps:


      - step: 1

        action:

          generate_secure_code



      - step: 2

        action:

          validate_code_rules



      - step: 3

        action:

          send_code_to_ttlock



      - step: 4

        action:

          confirm_lock_activation



    outputs:


      - guest_access_code



    state_machine:


      - SM-057 Access Code Lifecycle



    events:


      produces:


        - EVT-057 access_code_created



    orchestration:


      - ORCH-057 Door Code Management



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 005_integration_engine



    integrations:


      providers:


        - TTLock



    security:


      requirements:


        - encrypted_access_codes

        - audit_access_changes



    error_handling:


      strategy:


        regenerate_code



    compensation:


      actions:


        - revoke_generated_code



    observability:


      metrics:


        - code_generation_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001