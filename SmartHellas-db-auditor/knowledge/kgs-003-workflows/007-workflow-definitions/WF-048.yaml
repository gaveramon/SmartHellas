definition_registry:

  # ==========================================================
  # WF-048 Automation Lifecycle Management
  # ==========================================================


  - id: WF-048

    name: automation_lifecycle_management

    title: Automation Lifecycle Management


    version: 1.0

    status: active


    identity:


      domain:

        - automation


      owner:

        module: 016_automation_engine


      classification:


        business_process: automation_management

        criticality: business_critical

        ssot: true



    purpose:


      description: >
        Creates, deploys, updates and manages
        smart home automation rules across properties.



    scope:


      includes:


        - automation_creation

        - automation_updates

        - automation_testing

        - automation_activation

        - automation_retirement



      excludes:


        - physical_device_installation



    trigger:


      events:


        - EVT-050 automation_deployed

        - customer_automation_change_requested



    preconditions:


      - devices_available

      - automation_engine_active



    actors:


      - customer

      - system

      - operations_employee



    inputs:


      - automation_template

      - property_configuration



    workflow_steps:


      - step: 1

        action:

          validate_automation_request



      - step: 2

        action:

          create_or_update_rules



      - step: 3

        action:

          bind_devices



      - step: 4

        action:

          execute_test_run



      - step: 5

        action:

          activate_automation



    outputs:


      - active_automation_set



    state_machine:


      - SM-048 Automation Lifecycle



    events:


      produces:


        - EVT-094 automation_updated



    orchestration:


      - ORCH-048 Automation Management



    dependencies:


      modules:


        - 016_automation_engine

        - 003_property_device_engine

        - 005_integration_engine



    integrations:


      - Aqara Integration

      - TTLock Integration



    security:


      requirements:


        - automation_permission_validation



    error_handling:


      strategy:


        disable_failed_automation



    compensation:


      actions:


        - restore_previous_rule_version



    observability:


      metrics:


        - automation_execution_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001