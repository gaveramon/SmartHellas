        - EVT-033 device_registered



    preconditions:


      - device_provisioned

      - integration_available



    actors:


      - system

      - installer



    inputs:


      - device_credentials

      - gateway_information



    workflow_steps:


      - step: 1

        action:

          validate_device_identity



      - step: 2

        action:

          connect_device_gateway



      - step: 3

        action:

          authenticate_provider_connection



      - step: 4

        action:

          test_device_communication



    outputs:


      - paired_device



    state_machine:


      - SM-011 Device Lifecycle



    events:


      consumes:


        - EVT-033 device_registered



      produces:


        - EVT-034 device_paired



    orchestration:


      - ORCH-012 Device Pairing



    dependencies:


      modules:


        - 003_property_device_engine

        - 005_integration_engine



    integrations:


      - Aqara Integration

      - TTLock Integration



    security:


      requirements:


        - credential_protection

        - encrypted_communication



    error_handling:


      strategy:


        retry_pairing_process



    compensation:


      actions:


        - unpair_device



    observability:


      metrics:


        - pairing_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001




  # ==========================================================
  # WF-013 Device Firmware Update
  # ==========================================================


  - id: WF-013

    name: device_firmware_update

    title: Device Firmware Update


    version: 1.0

    status: active


    identity:


      domain:

        - device_maintenance


      owner:

        module: 006_operations_engine



    purpose:


      description:

        Keeps connected devices on supported firmware versions.



    scope:


      includes:


        - firmware_check

        - update_execution

        - validation



    trigger:


      event:


        - EVT-035 firmware_update_required



    preconditions:


      - device_online

      - supported_firmware_available



    actors:


      - system



    inputs:


      - device_identifier

      - firmware_version



    workflow_steps:


      - step: 1

        action:

          check_current_firmware



      - step: 2

        action:

          download_update



      - step: 3

        action:

          apply_firmware_update



      - step: 4

        action:

          validate_device_status



    outputs:


      - updated_device



    state_machine:


      - SM-013 Firmware Update Lifecycle



    events:


      produces:


        - EVT-036 firmware_updated



    orchestration:


      - ORCH-013 Firmware Management



    dependencies:


      modules:


        - 006_operations_engine

        - 005_integration_engine



    integrations:


      - Aqara Integration

      - TTLock Integration



    security:


      requirements:


        - firmware_signature_validation



    error_handling:


      strategy:


        rollback_or_retry_update



    compensation:


      actions:


        - restore_previous_firmware



    observability:


      metrics:


        - firmware_update_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001

definition_registry:


  # ==========================================================
  # WF-014 Device Installation
  # ==========================================================


  - id: WF-014

    name: device_installation

    title: Device Installation


    version: 1.0

    status: active


    identity:

      domain:

        - installation


      owner:

        module: 011_onboarding_engine



    purpose:

      description:

        Guides installation of SmartHellas devices
        at the Airbnb property.



    scope:

      includes:

        - installation_guidance

        - device_location_confirmation

        - installation_completion



      excludes:

        - hardware_repair



    trigger:


      event:


        - EVT-034 device_paired



    preconditions:


      - device_paired

      - installation_plan_available



    actors:


      - customer

      - installer

      - system



    inputs:


      - installation_plan

      - room_mapping



    workflow_steps:


      - step: 1

        action:

          display_installation_instructions



      - step: 2

        action:

          confirm_device_location



      - step: 3

        action:

          confirm_installation_completion



      - step: 4

        action:

          start_validation



    outputs:


      - installed_device



    state_machine:


      - SM-014 Installation Lifecycle



    events:


      produces:


        - EVT-037 installation_completed



    orchestration:


      - ORCH-014 Installation Guidance



    dependencies:


      modules:


        - 011_onboarding_engine

        - 010_service_portal_engine

        - 003_property_device_engine



    integrations: []


    security:


      requirements:


        - installation_authorization



    error_handling:


      strategy:


        create_installation_issue



    compensation:


      actions:


        - reopen_installation_task



    observability:


      metrics:


        - installation_completion_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001




  # ==========================================================
  # WF-015 Device Health Monitoring
