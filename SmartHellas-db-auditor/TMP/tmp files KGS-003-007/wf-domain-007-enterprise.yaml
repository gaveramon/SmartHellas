definition_registry:

  # ==========================================================
  # WF-060 Subscription Lifecycle Management
  # ==========================================================


  - id: WF-060

    name: subscription_lifecycle_management

    title: Subscription Lifecycle Management


    version: 1.0

    status: active


    identity:

      domain:

        - saas_management


      owner:

        module: 002_core_saas


      classification:

        business_process: subscription_management

        criticality: business_critical

        ssot: true



    purpose:

      description: >
        Manages the complete lifecycle of SmartHellas
        subscriptions from activation through renewal,
        suspension and termination.



    scope:

      includes:

        - subscription_creation

        - subscription_activation

        - subscription_renewal

        - subscription_suspension

        - subscription_termination


      excludes:

        - payment_processing



    trigger:


      events:


        - EVT-040 subscription_activated

        - payment_completed



    preconditions:


      - customer_exists

      - selected_subscription_plan_exists



    actors:


      - customer

      - system



    inputs:


      - customer_account

      - subscription_plan

      - payment_status



    workflow_steps:


      - step: 1

        action:

          validate_subscription_request



      - step: 2

        action:

          create_subscription_instance



      - step: 3

        action:

          assign_subscription_features



      - step: 4

        action:

          activate_subscription



      - step: 5

        action:

          monitor_subscription_state



    outputs:


      - active_subscription

      - subscription_status



    state_machine:


      - SM-060 Subscription Lifecycle



    events:


      produces:


        - EVT-060 subscription_created

        - EVT-061 subscription_status_changed



    orchestration:


      - ORCH-060 Subscription Management



    dependencies:


      modules:


        - 002_core_saas

        - 009_commerce_engine

        - 010_service_portal_engine



    integrations:


      - Payment Provider



    security:


      requirements:


        - tenant_isolation

        - subscription_permission_validation



    error_handling:


      strategy:


        retry_subscription_activation



    compensation:


      actions:


        - rollback_subscription_creation



    observability:


      metrics:


        - active_subscription_count

        - churn_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001





  # ==========================================================
  # WF-061 Usage Metering & Entitlement Tracking
  # ==========================================================


  - id: WF-061

    name: usage_metering_entitlement_tracking

    title: Usage Metering & Entitlement Tracking


    version: 1.0

    status: active


    identity:


      domain:


        - saas_usage



      owner:


        module: 002_core_saas



      classification:


        business_process: feature_control

        criticality: business_critical

        ssot: true



    purpose:


      description: >
        Measures customer usage and validates which
        SmartHellas features are available based on
        subscription entitlements.



    scope:


      includes:


        - usage_collection

        - feature_validation

        - entitlement_checking

        - usage_reporting



      excludes:


        - billing_generation



    trigger:


      events:


        - portal_action

        - automation_execution

        - api_request



    preconditions:


      - active_subscription_exists



    actors:


      - system



    inputs:


      - subscription_plan

      - usage_events

      - feature_requests



    workflow_steps:


      - step: 1

        action:

          collect_usage_event



      - step: 2

        action:

          validate_entitlement



      - step: 3

        action:

          update_usage_counter



      - step: 4

        action:

          generate_usage_report



    outputs:


      - usage_record

      - entitlement_status



    state_machine:


      - SM-061 Usage Tracking Lifecycle



    events:


      produces:


        - EVT-062 usage_record_created



    orchestration:


      - ORCH-061 Usage Metering



    dependencies:


      modules:


        - 002_core_saas

        - 010_service_portal_engine

        - 016_automation_engine



    integrations: []



    security:


      requirements:


        - usage_data_protection

        - tenant_data_isolation



    error_handling:


      strategy:


        queue_failed_usage_events



    compensation:


      actions:


        - recalculate_usage



    observability:


      metrics:


        - feature_usage

        - entitlement_failures



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001





  # ==========================================================
  # WF-062 Billing & Invoice Processing
  # ==========================================================


  - id: WF-062

    name: billing_invoice_processing

    title: Billing & Invoice Processing


    version: 1.0

    status: active


    identity:


      domain:


        - commerce_billing



      owner:


        module: 009_commerce_engine



      classification:


        business_process: financial_processing

        criticality: business_critical

        ssot: true



    purpose:


      description: >
        Generates invoices and manages recurring
        subscription billing.



    scope:


      includes:


        - invoice_generation

        - recurring_billing

        - payment_status_tracking

        - billing_history



      excludes:


        - subscription_definition



    trigger:


      events:


        - billing_cycle_started



    preconditions:


      - active_subscription_exists

      - billing_information_available



    actors:


      - system

      - customer



    inputs:


      - subscription

      - billing_information

      - usage_records



    workflow_steps:


      - step: 1

        action:

          calculate_billing_amount



      - step: 2

        action:

          generate_invoice



      - step: 3

        action:

          request_payment



      - step: 4

        action:

          update_payment_status



      - step: 5

        action:

          store_invoice_history



    outputs:


      - invoice

      - payment_status



    state_machine:


      - SM-062 Billing Lifecycle



    events:


      produces:


        - EVT-063 invoice_created

        - EVT-064 payment_received



    orchestration:


      - ORCH-062 Billing Process



    dependencies:


      modules:


        - 009_commerce_engine

        - 002_core_saas



    integrations:


      - Payment Provider



    security:


      requirements:


        - financial_data_protection

        - audit_logging



    error_handling:


      strategy:


        retry_payment_collection



    compensation:


      actions:


        - cancel_invoice



    observability:


      metrics:


        - recurring_revenue

        - failed_payment_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001



    purpose:


      description: >
        Coordinates complex automation scenarios
        across devices, sensors, energy systems
        and guest events.



    scope:


