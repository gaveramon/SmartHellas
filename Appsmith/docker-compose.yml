services:
   appsmith:
     image: index.docker.io/appsmith/appsmith-ee:v2.1
     container_name: appsmith
     ports:
         - "80:80"
         - "443:443"
     volumes:
         - ./stacks:/appsmith-stacks
     restart: unless-stopped
     environment:
       - APPSMITH_DB_URL=postgresql://postgres:password@db:5432/appsmith
