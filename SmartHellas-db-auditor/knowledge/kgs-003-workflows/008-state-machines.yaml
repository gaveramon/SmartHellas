state_machine_registry:

  # ==========================================================
  # SM-001 Customer Lifecycle
  # ==========================================================

  - id: SM-001

    name: customer_lifecycle

    title: Customer Lifecycle

    version: 1.0

    status: active

    description: >
      Defines the lifecycle of a customer account from creation
      through active usage and eventual termination.

    initial_state: pending

    states:

      - pending

      - registered

      - verified

      - active

      - suspended

      - deactivated

      - archived

    terminal_states:

      - archived

    transitions:

      - id: TR-001-01
        from: pending
        to: registered

      - id: TR-001-02
        from: registered
        to: verified

      - id: TR-001-03
        from: verified
        to: active

      - id: TR-001-04
        from: active
        to: suspended

      - id: TR-001-05
        from: suspended
        to: active

      - id: TR-001-06
        from: active
        to: deactivated

      - id: TR-001-07
        from: deactivated
        to: archived

    rules:

      allow_reentry: false

      allow_skip_states: false

      require_terminal_state: true

      immutable_history: true


    audit:

      reusable: true

      canonical: true

      last_reviewed: null


  # ==========================================================
  # SM-002 Organization Lifecycle
