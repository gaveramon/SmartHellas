definition_registry:

  # ==========================================================
  # WF-030 Configurator Recommendation
  # ==========================================================

  - id: WF-030

    name: configurator_recommendation

    title: Configurator Recommendation

    version: 1.0

    status: active

    identity:

      domain:
        - commerce

      owner:
        module: 009_commerce_engine

    purpose:

      description: >
        Converts customer requirements into a complete
        SmartHellas solution including hardware,
        services and subscription recommendations.

    scope:

      includes:
        - questionnaire_processing
        - room_analysis
        - hardware_calculation
        - service_selection
        - subscription_recommendation

      excludes:
        - payment_processing

    trigger:

      action:
        - configurator_completed

    preconditions:
      - questionnaire_completed

    actors:
      - customer
      - system

    inputs:
      - questionnaire_answers
      - property_information

    workflow_steps:

      - step: 1
        action: validate_questionnaire

      - step: 2
        action: calculate_required_devices

      - step: 3
        action: determine_required_services

      - step: 4
        action: recommend_subscription

      - step: 5
        action: build_solution_package

    outputs:
      - recommended_solution
      - recommended_devices
      - recommended_services
      - recommended_subscription

    state_machine:
      - SM-030 Commerce Lifecycle

    events:

      produces:
        - EVT-030 solution_generated

    orchestration:
      - ORCH-030 Commerce Recommendation

    dependencies:

      modules:
        - 009_commerce_engine
        - 002_core_saas

    integrations: []

    security:

      requirements:
        - customer_session_required

    error_handling:

      strategy:
        restart_configuration

    compensation:

      actions:
        - discard_partial_configuration

    observability:

      metrics:
        - recommendation_generation_time

    audit:

      enabled: true

    lifecycle:

      policy:
        LIFE-001



  # ==========================================================
  # WF-031 Shopping Cart Management
  # ==========================================================

  - id: WF-031

    name: shopping_cart_management

    title: Shopping Cart Management

    version: 1.0

    status: active

    identity:

      domain:
        - commerce

      owner:
        module: 009_commerce_engine

    purpose:

      description: >
        Manages the SmartHellas shopping cart,
        including products, services and subscriptions.

    scope:

      includes:
        - cart_creation
        - cart_update
        - pricing
        - discounts
        - subscription_selection

    trigger:

      action:
        - product_added

    preconditions:
      - active_customer_session

    actors:
      - customer

    inputs:
      - selected_products
      - selected_services

    workflow_steps:

      - step: 1
        action: validate_products

      - step: 2
        action: calculate_pricing

      - step: 3
        action: apply_discounts

      - step: 4
        action: calculate_subscription_cost

      - step: 5
        action: update_cart

    outputs:
      - shopping_cart

    state_machine:
      - SM-030 Commerce Lifecycle

    events:

      produces:
        - EVT-031 cart_updated

    orchestration:
      - ORCH-031 Shopping Cart

    dependencies:

      modules:
        - 009_commerce_engine

    integrations:
      - Payment Provider

    security:

      requirements:
        - authenticated_session

    error_handling:

      strategy:
        restore_previous_cart

    compensation:

      actions:
        - rollback_cart_changes

    observability:

      metrics:
        - cart_conversion_rate

    audit:

      enabled: true

    lifecycle:

      policy:
        LIFE-001



  # ==========================================================
  # WF-032 Order Processing
  # ==========================================================

  - id: WF-032

    name: order_processing

    title: Order Processing

    version: 1.0

    status: active

    identity:

      domain:
        - commerce

      owner:
        module: 009_commerce_engine

    purpose:

      description: >
        Converts an approved shopping cart into
        a SmartHellas order and starts downstream workflows.

    scope:

      includes:
        - order_creation
        - order_validation
        - workflow_initialization

      excludes:
        - shipment

    trigger:

      event:
        - EVT-031 checkout_completed

    preconditions:
      - payment_pending_or_authorized

    actors:
      - customer
      - system

    inputs:
      - shopping_cart

    workflow_steps:

      - step: 1
        action: validate_order

      - step: 2
        action: create_order

      - step: 3
        action: allocate_order_number

      - step: 4
        action: trigger_inventory_workflow

      - step: 5
        action: trigger_preconfiguration_workflow

    outputs:
      - order

    state_machine:
      - SM-031 Order Lifecycle

    events:

      produces:
        - EVT-032 order_created

    orchestration:
      - ORCH-032 Order Processing

    dependencies:

      modules:
        - 009_commerce_engine
        - 007_preconfig_engine
        - 008_logistics_engine

    integrations:
      - Payment Provider

    security:

      requirements:
        - order_validation_required

    error_handling:

      strategy:
        rollback_order

    compensation:

      actions:
        - cancel_created_order

    observability:

      metrics:
        - order_processing_time

    audit:

      enabled: true

    lifecycle:

      policy:
        LIFE-001

definition_registry:

  # ==========================================================
  # WF-033 Payment Processing
  # ==========================================================

  - id: WF-033

    name: payment_processing

    title: Payment Processing

    version: 1.0

    status: active

    identity:

      domain:
        - commerce

      owner:
        module: 009_commerce_engine

    purpose:

      description: >
        Processes customer payments, verifies payment status,
        creates financial records and authorizes order execution.

    scope:

      includes:
        - payment_authorization
        - payment_capture
        - payment_confirmation
        - invoice_creation

      excludes:
        - refund_processing

    trigger:

      event:
        - EVT-032 order_created

    preconditions:
      - valid_order_exists
      - payment_method_selected

    actors:
      - customer
      - payment_provider
      - system

    inputs:
      - order
      - payment_method

    workflow_steps:

      - step: 1
        action: validate_payment_request

      - step: 2
        action: authorize_payment

      - step: 3
        action: capture_payment

      - step: 4
        action: create_invoice

      - step: 5
        action: notify_order_processing

    outputs:
      - payment
      - invoice

    state_machine:
      - SM-032 Payment Lifecycle

    events:

      produces:
        - EVT-033 payment_completed

    orchestration:
      - ORCH-032 Order Processing

    dependencies:

      modules:
        - 009_commerce_engine

    integrations:
      - Payment Provider

    security:

      requirements:
        - pci_compliance
        - encrypted_payment_data

    error_handling:

      strategy:
        retry_payment

    compensation:

      actions:
        - cancel_payment

    observability:

      metrics:
        - payment_success_rate

    audit:

      enabled: true

    lifecycle:

      policy:
        LIFE-001



  # ==========================================================
  # WF-034 Inventory Allocation
  # ==========================================================

  - id: WF-034

    name: inventory_allocation

    title: Inventory Allocation

    version: 1.0

    status: active

    identity:

      domain:
        - logistics

      owner:
        module: 008_logistics_engine

    purpose:

      description: >
        Reserves the required SmartHellas hardware
        for an approved customer order.

    scope:

      includes:
        - stock_validation
        - inventory_reservation
        - shortage_detection

    trigger:

      event:
        - EVT-033 payment_completed

    preconditions:
      - payment_confirmed

    actors:
      - system

    inputs:
      - order

    workflow_steps:

      - step: 1
        action: validate_inventory

      - step: 2
        action: reserve_devices

      - step: 3
        action: detect_missing_items

      - step: 4
        action: notify_preconfiguration

    outputs:
      - reserved_inventory

    state_machine:
      - SM-033 Inventory Lifecycle

    events:

      produces:
        - EVT-034 inventory_reserved

    orchestration:
      - ORCH-032 Order Processing

    dependencies:

      modules:
        - 008_logistics_engine
        - 007_preconfig_engine

    integrations: []

    security:

      requirements:
        - inventory_consistency

    error_handling:

      strategy:
        backorder_processing

    compensation:

      actions:
        - release_inventory

    observability:

      metrics:
        - reservation_success_rate

    audit:

      enabled: true

    lifecycle:

      policy:
        LIFE-001



  # ==========================================================
  # WF-035 Smart Configuration Planning
  # ==========================================================

  - id: WF-035

    name: smart_configuration_planning

    title: Smart Configuration Planning

    version: 1.0

    status: active

    identity:

      domain:
        - preconfiguration

      owner:
        module: 007_preconfig_engine

    purpose:

      description: >
        Builds the complete SmartHellas installation plan,
        processes the pre-onboarding questionnaire,
        assigns rooms and devices, prepares QR labels,
        automation templates and installation package.

    scope:

      includes:
        - pre_onboarding_processing
        - room_creation
        - device_assignment
        - qr_generation
        - label_generation
        - automation_planning
        - firmware_planning
        - installation_package_creation

    trigger:

      event:
        - EVT-034 inventory_reserved

    preconditions:
      - inventory_reserved
      - customer_questionnaire_completed

    actors:
      - operations_employee
      - system

    inputs:
      - order
      - questionnaire
      - reserved_inventory

    workflow_steps:

      - step: 1
        action: import_questionnaire

      - step: 2
        action: create_property_structure

      - step: 3
        action: assign_devices_to_rooms

      - step: 4
        action: generate_room_labels

      - step: 5
        action: generate_qr_codes

      - step: 6
        action: prepare_aqara_configuration

      - step: 7
        action: prepare_ttlock_configuration

      - step: 8
        action: prepare_automation_templates

      - step: 9
        action: build_installation_package

    outputs:
      - preconfiguration_package

    state_machine:
      - SM-034 Preconfiguration Lifecycle

    events:

      produces:
        - EVT-035 preconfiguration_completed

    orchestration:
      - ORCH-032 Order Processing

    dependencies:

      modules:
        - 007_preconfig_engine
        - 003_property_device_engine
        - 005_integration_engine
        - 008_logistics_engine
        - 011_onboarding_engine

    integrations:
      - Aqara Integration
      - TTLock Integration

    security:

      requirements:
        - configuration_validation
        - asset_traceability

    error_handling:

      strategy:
        suspend_preconfiguration

    compensation:

      actions:
        - rollback_device_assignments

    observability:

      metrics:
        - preconfiguration_completion_time
        - configuration_accuracy

    audit:

      enabled: true

    lifecycle:

      policy:
        LIFE-001

definition_registry:

  # ==========================================================
  # WF-036 Device Packaging & Labeling
  # ==========================================================

  - id: WF-036

    name: device_packaging_labeling

    title: Device Packaging & Labeling

    version: 1.0

    status: active

    identity:

      domain:
        - logistics

      owner:
        module: 008_logistics_engine

    purpose:

      description: >
        Packages all configured SmartHellas devices,
        applies room labels and QR codes, and performs
        the final quality inspection before shipment.

    scope:

      includes:
        - package_preparation
        - room_label_attachment
        - qr_label_attachment
        - quality_control
        - shipment_preparation

    trigger:

      event:
        - EVT-035 preconfiguration_completed

    preconditions:
      - preconfiguration_completed

    actors:
      - warehouse_employee
      - system

    inputs:
      - preconfiguration_package

    workflow_steps:

      - step: 1
        action: collect_devices

      - step: 2
        action: verify_serial_numbers

      - step: 3
        action: attach_room_labels

      - step: 4
        action: attach_qr_labels

      - step: 5
        action: perform_quality_check

      - step: 6
        action: seal_package

    outputs:
      - shipment_package

    state_machine:
      - SM-035 Packaging Lifecycle

    events:

      produces:
        - EVT-036 package_ready

    orchestration:
      - ORCH-032 Order Processing

    dependencies:

      modules:
        - 008_logistics_engine
        - 007_preconfig_engine

    observability:

      metrics:
        - packaging_time
        - packaging_accuracy

    audit:
      enabled: true

    lifecycle:
      policy: LIFE-001



  # ==========================================================
  # WF-037 Shipment Fulfillment
  # ==========================================================

  - id: WF-037

    name: shipment_fulfillment

    title: Shipment Fulfillment

    version: 1.0

    status: active

    identity:

      domain:
        - logistics

      owner:
        module: 008_logistics_engine

    purpose:

      description: >
        Ships prepared SmartHellas orders and
        manages shipment tracking.

    trigger:

      event:
        - EVT-036 package_ready

    workflow_steps:

      - step: 1
        action: create_shipping_label

      - step: 2
        action: register_track_trace

      - step: 3
        action: handover_to_carrier

      - step: 4
        action: notify_customer

    outputs:
      - shipment

    state_machine:
      - SM-036 Shipment Lifecycle

    events:

      produces:
        - EVT-037 order_shipped

    orchestration:
      - ORCH-032 Order Processing

    dependencies:

      modules:
        - 008_logistics_engine

    audit:
      enabled: true

    lifecycle:
      policy: LIFE-001



  # ==========================================================
  # WF-038 Return & RMA Processing
  # ==========================================================

  - id: WF-038

    name: return_rma_processing

    title: Return & RMA Processing

    version: 1.0

    status: active

    identity:

      domain:
        - logistics

      owner:
        module: 008_logistics_engine

    purpose:

      description: >
        Handles returns, warranty claims and
        replacement logistics.

    trigger:

      event:
        - EVT-038 return_requested

    workflow_steps:

      - step: 1
        action: validate_rma

      - step: 2
        action: receive_return

      - step: 3
        action: inspect_devices

      - step: 4
        action: replace_or_restock

    outputs:
      - rma_result

    state_machine:
      - SM-037 Return Lifecycle

    events:

      produces:
        - EVT-039 return_completed

    orchestration:
      - ORCH-038 Return Handling

    dependencies:

      modules:
        - 008_logistics_engine
        - 009_commerce_engine

    audit:
      enabled: true

    lifecycle:
      policy: LIFE-001



  # ==========================================================
  # WF-039 Subscription Provisioning
  # ==========================================================

  - id: WF-039

    name: subscription_provisioning

    title: Subscription Provisioning

    version: 1.0

    status: active

    identity:

      domain:
        - saas

      owner:
        module: 002_core_saas

    purpose:

      description: >
        Activates subscriptions, assigns portal
        permissions and enables SmartHellas services.

    trigger:

      event:
        - EVT-033 payment_completed

    workflow_steps:

      - step: 1
        action: create_subscription

      - step: 2
        action: assign_permissions

      - step: 3
        action: enable_portal_features

      - step: 4
        action: activate_automation_services

    outputs:
      - active_subscription

    state_machine:
      - SM-038 Subscription Lifecycle

    events:

      produces:
        - EVT-040 subscription_activated

    orchestration:
      - ORCH-039 Subscription Provisioning

    dependencies:

      modules:
        - 002_core_saas
        - 010_service_portal_engine
        - 011_onboarding_engine

    audit:
      enabled: true

    lifecycle:
      policy: LIFE-001
