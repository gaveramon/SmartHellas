definition_registry:

  # ==========================================================
  # WF-068 Enterprise Auditor Execution
  # ==========================================================


  - id: WF-068

    name: enterprise_auditor_execution

    title: Enterprise Auditor Execution


    version: 1.0

    status: active


    identity:


      domain:


        - architecture_governance



      owner:


        module:

          enterprise_auditor



      classification:


        business_process: governance

        criticality: platform_critical

        ssot: true



    purpose:


      description: >
        Executes automated architecture audits using
        KGS knowledge, rules and analysis engines.



    scope:


      includes:


        - dependency_analysis

        - ssot_validation

        - rule_validation

        - architecture_reporting



      excludes:


        - automatic_schema_modification



    trigger:


      events:


        - scheduled_audit_execution

        - architecture_change_detected



    preconditions:


      - auditor_configuration_available



    actors:


      - system

      - architect



    inputs:


      - kgs_knowledge_layer

      - sql_schema

      - yaml_configuration

      - ruleset



    workflow_steps:


      - step: 1

        action:

          parse_system_definition



      - step: 2

        action:

          build_dependency_graph



      - step: 3

        action:

          execute_ssot_audit



      - step: 4

        action:

          generate_violation_report



      - step: 5

        action:

          publish_architecture_report



    outputs:


      - dependency_report

      - violations_report

      - architecture_report



    dependencies:


      modules:


        - enterprise_auditor



    integrations:


      - Git Repository



    security:


      requirements:


        - audit_integrity

        - immutable_audit_logs



    observability:


      metrics:


        - audit_duration

        - violation_count



    audit:


      enabled:

        true



    lifecycle:


      policy:

        LIFE-001