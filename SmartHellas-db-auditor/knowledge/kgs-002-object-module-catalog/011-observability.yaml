metadata:

  kgs:
    id: KGS-002
    version: "2.0"

authority:

  role: observability_definition

scope:

  domain: enterprise_object_module_catalog

# ============================================================
# OBSERVABILITY REGISTRY
# ============================================================


observability:


  description: >

    Canonical operational visibility model defining logging,
    metrics, tracing, monitoring and alerting.



  ownership:


    primary:

      module:

        "013_monitoring_audit_engine"



  principles:


    - structured_logging

    - immutable_audit_history

    - correlation_tracking

    - proactive_monitoring

    - privacy_aware_logging



# ============================================================
# LOGGING
# ============================================================


  logging:


    format:


      structured:

        true



    required_fields:


      - timestamp

      - event_id

      - correlation_id

      - tenant_id

      - module_id

      - action

      - status



    levels:


      - debug

      - info

      - warning

      - error

      - critical



# ============================================================
# AUDIT EVENTS
# ============================================================


  audit_logging:


    immutable:

      true



    required_events:


      authentication:


        - login

        - logout

        - failed_login



      security:


        - permission_change

        - role_change



      business:


        - order_created

        - booking_created

        - access_code_generated

        - device_configuration_changed



# ============================================================
# METRICS
# ============================================================


  metrics:


    technical:


      - api_latency

      - database_latency

      - error_rate

      - queue_depth



    business:


      - active_properties

      - active_devices

      - subscriptions

      - onboarding_completion



    operational:


      - failed_integrations

      - automation_failures

      - support_cases



# ============================================================
# TRACING
# ============================================================


  tracing:


    enabled:

      true



    targets:


      - api_requests

      - workflows

      - integrations

      - automation_execution

      - background_jobs



# ============================================================
# MONITORING & ALERTS
# ============================================================


  alerts:


    conditions:


      - integration_failure

      - device_offline

      - automation_failure

      - security_violation

      - queue_backlog



    severity:


      - info

      - warning

      - error

      - critical
