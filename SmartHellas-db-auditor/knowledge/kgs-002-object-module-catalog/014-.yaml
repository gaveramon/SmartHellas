metadata:

  kgs:
    id: KGS-002
    version: "2.0"

authority:

  role: ssot_definition

scope:

  domain: enterprise_object_module_catalog

# ============================================================
# SSOT
# ============================================================


ssot:


  description: >

    Defines canonical ownership boundaries
    and prevents duplicated truth.



  canonical_source:


    architecture:

      "KGS-002"



    ownership:

      "KGS-004"



    workflows:

      "KGS-003"



    business_rules:

      "KGS-005"



  invariants:


    - one_object_one_owner

    - no_duplicate_tables

    - no_duplicate_business_state

    - explicit_module_boundary



  conflict_resolution:


    rule:

      "The owning module definition is authoritative."
