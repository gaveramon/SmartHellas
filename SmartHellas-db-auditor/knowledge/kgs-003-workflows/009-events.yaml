  # ==========================================================

  - id: EVT-001

    name: customer_registered

    title: Customer Registered

    version: 1.0

    status: active

    description: >
      Triggered when a new customer account has been created.

    category: customer

    source:

      module: 002_core_saas

      system: smarthellas


    trigger:

      type: domain_event


    payload:

      objects:

        - customer


    consumers:

      workflows:

        - WF-CUSTOMER-ONBOARDING


    state_transitions:

      state_machine:

        - SM-001

      transition:

        from: pending

        to: registered


    rules:

      asynchronous: true

      retryable: true

      idempotent: true


    audit:

      canonical: true

      reusable: true

      last_reviewed: null



