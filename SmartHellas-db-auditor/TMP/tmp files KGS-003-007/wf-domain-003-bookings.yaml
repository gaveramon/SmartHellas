definition_registry:


  # ==========================================================
  # WF-026 Guest Check-out
  # ==========================================================


  - id: WF-026

    name: guest_check_out

    title: Guest Check-out


    version: 1.0

    status: active


    identity:

      domain:

        - guest_access


      owner:

        module: 004_booking_lock_engine



    purpose:

      description:

        Handles guest departure and initiates
        access termination process.



    scope:

      includes:

        - departure_detection

        - stay_completion

        - access_shutdown_trigger



      excludes:

        - cleaning_management



    trigger:


      event:


        - booking_end_time_reached



    preconditions:


      - active_guest_session_exists



    actors:


      - guest

      - system



    inputs:


      - booking

      - guest_access_profile



    workflow_steps:


      - step: 1

        action:

          validate_checkout_time



      - step: 2

        action:

          close_guest_session



      - step: 3

        action:

          trigger_access_revocation



      - step: 4

        action:

          update_booking_status



    outputs:


      - completed_booking



    state_machine:


      - SM-023 Guest Access Lifecycle



    events:


      produces:


        - EVT-027 guest_checked_out



    orchestration:


      - ORCH-026 Checkout Automation



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 006_operations_engine



    integrations:


      - TTLock Integration



    security:


      requirements:


        - booking_validation



    error_handling:


      strategy:


        manual_checkout_review



    compensation:


      actions:


        - restore_access_if_required



    observability:


      metrics:


        - checkout_completion_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001




  # ==========================================================
  # WF-027 Access Revocation
  # ==========================================================


  - id: WF-027

    name: access_revocation

    title: Access Revocation


    version: 1.0

    status: active


    identity:


      domain:

        - access_control


      owner:

        module: 004_booking_lock_engine



    purpose:


      description:

        Removes temporary guest permissions
        after reservation completion.



    scope:


      includes:


        - code_deactivation

        - permission_removal

        - lock_update



    trigger:


      event:


        - EVT-027 guest_checked_out



    preconditions:


      - guest_access_exists



    actors:


      - system



    inputs:


      - access_profile



    workflow_steps:


      - step: 1

        action:

          identify_active_permissions



      - step: 2

        action:

          disable_access_code



      - step: 3

        action:

          synchronize_lock_state



      - step: 4

        action:

          verify_access_removed



    outputs:


      - revoked_access



    state_machine:


      - SM-023 Guest Access Lifecycle



    events:


      produces:


        - EVT-028 access_revoked



    orchestration:


      - ORCH-027 Access Revocation



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 005_integration_engine



    integrations:


      - TTLock Integration

      - G2 Gateway



    security:


      requirements:


        - access_removal_confirmation



    error_handling:


      strategy:


        retry_lock_synchronization



    compensation:


      actions:


        - restore_previous_access_state



    observability:


      metrics:


        - revocation_success_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001

definition_registry:


  # ==========================================================
  # WF-028 Emergency Access
  # ==========================================================


  - id: WF-028

    name: emergency_access

    title: Emergency Access Management


    version: 1.0

    status: active


    identity:

      domain:

        - access_control


      owner:

        module: 004_booking_lock_engine



    purpose:

      description:

        Provides controlled emergency access for
        authorized persons when normal access fails.



    scope:

      includes:

        - emergency_access_request

        - authorization_check

        - temporary_access_creation



      excludes:

        - permanent_access_assignment



    trigger:


      event:


        - EVT-060 emergency_access_requested



    preconditions:


      - emergency_reason_provided

      - requester_authorized



    actors:


      - property_owner

      - support_agent

      - system



    inputs:


      - property_identifier

      - emergency_reason

      - requester_identity



    workflow_steps:


      - step: 1

        action:

          validate_emergency_request



      - step: 2

        action:

          verify_authorization



      - step: 3

        action:

          generate_emergency_access



      - step: 4

        action:

          monitor_access_usage



      - step: 5

        action:

          revoke_emergency_access



    outputs:


      - emergency_access_permission



    state_machine:


      - SM-023 Guest Access Lifecycle



    events:


      produces:


        - EVT-061 emergency_access_created



    orchestration:


      - ORCH-028 Emergency Access



    dependencies:


      modules:


        - 004_booking_lock_engine

        - 010_service_portal_engine



    integrations:


      - TTLock Integration

      - G2 Gateway



    security:


      requirements:


        - elevated_authorization_required

        - full_audit_logging



    error_handling:


      strategy:


        escalate_to_support



    compensation:


      actions:


        - immediately_revoke_access



    observability:


      metrics:


        - emergency_access_count



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001




  # ==========================================================
  # WF-029 Lock Failure Recovery
  # ==========================================================


  - id: WF-029

    name: lock_failure_recovery

    title: Lock Failure Recovery


    version: 1.0

    status: active


    identity:


      domain:

        - lock_operations


      owner:

        module: 006_operations_engine



    purpose:


      description:

        Detects and resolves smart lock failures
        affecting guest access.



    scope:


      includes:


        - lock_health_detection

        - connection_recovery

        - support_escalation



    trigger:


      event:


        - EVT-070 lock_failure_detected



    preconditions:


      - lock_registered

      - monitoring_enabled



    actors:


      - system

      - support_agent



    inputs:


      - lock_status

      - gateway_status



    workflow_steps:


      - step: 1

        action:

          analyze_failure



      - step: 2

        action:

          test_gateway_connection



      - step: 3

        action:

          attempt_remote_recovery



      - step: 4

        action:

          create_support_case_if_failed



    outputs:


      - recovered_lock

      - support_case



    state_machine:


      - SM-029 Lock Recovery Lifecycle



    events:


      produces:


        - EVT-071 lock_recovered

        - EVT-072 recovery_failed



    orchestration:


      - ORCH-029 Lock Recovery



    dependencies:


      modules:


        - 006_operations_engine

        - 005_integration_engine

        - 010_service_portal_engine



    integrations:


      - TTLock Integration

      - G2 Gateway



    security:


      requirements:


        - secure_remote_operation

        - operation_authorization



    error_handling:


      strategy:


        escalate_after_retry_limit



    compensation:


      actions:


        - enable_manual_access_procedure



    observability:


      metrics:


        - lock_recovery_time

        - lock_failure_rate



    audit:


      enabled: true



    lifecycle:


      policy:

        LIFE-001
